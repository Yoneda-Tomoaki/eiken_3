<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英検3級 英単語クイズ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen font-sans">

  <!-- ==================== HOME SCREEN ==================== -->
  <div id="homeScreen" class="max-w-lg mx-auto px-4 py-6">
    <div class="text-center mb-6">
      <span class="inline-block bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-full mb-2">英検3級対策</span>
      <h1 class="text-3xl font-bold text-blue-900">英単語クイズ</h1>
      <p class="text-blue-400 text-sm mt-1">全250問 ／ 10問 × 25セクション</p>
    </div>
    <div id="sectionList" class="space-y-4"></div>
    <p class="text-center text-xs text-gray-300 mt-8">英検3級 英単語クイズアプリ</p>
  </div>

  <!-- ==================== QUIZ SCREEN ==================== -->
  <div id="quizScreen" class="hidden max-w-lg mx-auto px-4 py-4">
    <div class="flex items-center justify-between mb-2">
      <button id="backBtn" class="text-blue-500 font-semibold text-sm py-1 flex items-center gap-1 active:text-blue-800 transition">
        ← 中断して戻る
      </button>
      <span id="quizProgress" class="text-blue-700 text-sm font-bold"></span>
    </div>
    <div class="w-full bg-blue-100 rounded-full h-2 mb-4">
      <div id="progressBar" class="bg-blue-500 h-2 rounded-full transition-all duration-300" style="width:0%"></div>
    </div>

    <!-- Question Card -->
    <div class="bg-white rounded-2xl shadow-md p-5 mb-4">
      <div class="mb-4">
        <p class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-1">意味 / Hint</p>
        <p id="wordMeaning" class="text-2xl font-bold text-blue-900"></p>
        <p id="phraseJa" class="text-sm text-gray-500 mt-1"></p>
      </div>
      <div class="border-t border-blue-50 pt-4">
        <p class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-1">フレーズ</p>
        <p id="phraseDisplay" class="text-lg text-gray-700 leading-relaxed font-medium"></p>
      </div>
    </div>

    <!-- Spelling Input -->
    <div class="mb-4">
      <p class="text-xs font-bold text-blue-400 uppercase tracking-widest mb-2">スペルを入力（任意）</p>
      <input
        id="spellingInput"
        type="text"
        inputmode="latin"
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        placeholder="英単語・熟語を入力..."
        class="w-full border-2 border-blue-200 rounded-xl px-4 py-3 text-lg font-mono text-gray-800 bg-white focus:outline-none focus:border-blue-500 transition placeholder-gray-300"
      />
    </div>

    <!-- Show Answer Button -->
    <div id="showAnswerArea" class="text-center">
      <button id="showAnswerBtn" class="bg-blue-600 active:bg-blue-800 text-white font-bold py-3 px-10 rounded-full shadow-lg text-base transition-colors duration-150">
        答えを見る 👀
      </button>
    </div>

    <!-- Answer Area -->
    <div id="answerArea" class="hidden">
      <!-- Spelling Result -->
      <div id="spellingResult" class="hidden rounded-xl px-4 py-3 mb-3 text-center"></div>

      <!-- Answer Card -->
      <div class="bg-gradient-to-br from-blue-600 to-blue-700 text-white rounded-2xl shadow-lg p-5 mb-3">
        <div class="mb-3">
          <p class="text-xs font-bold text-blue-200 uppercase tracking-widest mb-1">正解</p>
          <p id="answerWord" class="text-3xl font-bold tracking-wide leading-tight"></p>
        </div>
        <div class="border-t border-blue-500 pt-3">
          <p class="text-xs font-bold text-blue-200 uppercase tracking-widest mb-1">フレーズ（正解）</p>
          <p id="answerPhrase" class="text-base leading-relaxed font-medium"></p>
        </div>
      </div>

      <!-- Speech Buttons -->
      <div class="flex gap-2 mb-3">
        <button id="speakPhraseBtn" class="flex-1 bg-white border border-blue-300 text-blue-700 font-semibold py-2 rounded-xl text-sm active:bg-blue-50 transition flex items-center justify-center gap-1">
          🔊 フレーズを聞く
        </button>
        <button id="speakWordBtn" class="flex-1 bg-white border border-blue-300 text-blue-700 font-semibold py-2 rounded-xl text-sm active:bg-blue-50 transition flex items-center justify-center gap-1">
          🔉 単語を聞く
        </button>
      </div>

      <!-- Self Assessment -->
      <div class="flex gap-3">
        <button id="wrongBtn" class="flex-1 bg-red-500 active:bg-red-700 text-white font-bold py-4 rounded-2xl text-xl shadow transition">
          ✕ 違った
        </button>
        <button id="correctBtn" class="flex-1 bg-green-500 active:bg-green-700 text-white font-bold py-4 rounded-2xl text-xl shadow transition">
          ◯ 合ってた
        </button>
      </div>
    </div>
  </div>

  <!-- ==================== RESULT SCREEN ==================== -->
  <div id="resultScreen" class="hidden max-w-lg mx-auto px-4 py-6">
    <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
      <div class="text-6xl mb-4">🎉</div>
      <h2 class="text-2xl font-bold text-blue-800 mb-1">セクション完了！</h2>
      <p class="text-gray-400 text-sm mb-6">お疲れさまでした</p>
      <div id="resultStats" class="bg-blue-50 rounded-xl p-4 mb-6"></div>
      <button id="backToHomeBtn" class="bg-blue-600 active:bg-blue-800 text-white font-bold py-3 px-10 rounded-full shadow-lg text-base transition">
        ホームに戻る
      </button>
    </div>
  </div>

// ==================== CONSTANTS ====================
const SECTION_SIZE = 10;
const WEAK_KEY     = 'eiken3_weak';
const ANSWERED_KEY = 'eiken3_answered';

// ==================== STATE ====================
let currentQueue   = [];
let currentIndex   = 0;
let sessionCorrect = 0;
let sessionWrong   = 0;

// ==================== STORAGE ====================
const storage = {
  getWeak()       { return new Set(JSON.parse(localStorage.getItem(WEAK_KEY)     || '[]')); },
  getAnswered()   { return new Set(JSON.parse(localStorage.getItem(ANSWERED_KEY) || '[]')); },
  saveWeak(s)     { localStorage.setItem(WEAK_KEY,     JSON.stringify([...s])); },
  saveAnswered(s) { localStorage.setItem(ANSWERED_KEY, JSON.stringify([...s])); },
};

// ==================== SECTIONS ====================
function getSections() {
  const out = [];
  for (let i = 0; i < words.length; i += SECTION_SIZE) {
    out.push(words.slice(i, i + SECTION_SIZE));
  }
  return out;
}

// ==================== SCREEN MANAGEMENT ====================
function showScreen(id) {
  ['homeScreen', 'quizScreen', 'resultScreen'].forEach(sid => {
    const el = document.getElementById(sid);
    if (el) el.classList.add('hidden');
  });
  const target = document.getElementById(id);
  if (target) target.classList.remove('hidden');
}

// ==================== HOME SCREEN ====================
function renderHome() {
  showScreen('homeScreen');
  window.speechSynthesis.cancel();

  const sections = getSections();
  const weak     = storage.getWeak();
  const answered = storage.getAnswered();
  const list     = document.getElementById('sectionList');
  list.innerHTML = '';

  const sectionLabels = [
    "基本動詞1","基本名詞・形容詞","環境・社会系","表現・コミュニケーション",
    "形容詞・副詞","動詞（頻出1）","動詞（頻出2）","動詞（頻出3）",
    "名詞（頻出1）","名詞（頻出2）","形容詞（頻出）","副詞・接続詞",
    "熟語1（動詞句）","熟語2（副詞句）","熟語3（重要イディオム）",
    "動詞（基本・頻出）","動詞（活動・移動）","動詞（達成・変化）","名詞（場所・自然）","名詞（生活・日常）",
    "名詞（目標・活動）","形容詞（感情・性格）","形容詞（状態・評価）","形容詞（様子・程度）","副詞"
  ];

  sections.forEach((sectionWords, idx) => {
    const weakInSection     = sectionWords.filter(w => weak.has(w.id));
    const answeredInSection = sectionWords.filter(w => answered.has(w.id));
    const hasWeak    = weakInSection.length > 0;
    const allAnswered = answeredInSection.length === sectionWords.length;
    const isMaster   = allAnswered && !hasWeak;

    let statusHtml;
    if (isMaster) {
      statusHtml = '<span class="bg-green-100 text-green-700 font-bold text-xs px-2 py-1 rounded-full whitespace-nowrap">マスター済み ✨</span>';
    } else if (hasWeak) {
      statusHtml = `<span class="bg-orange-100 text-orange-600 font-bold text-xs px-2 py-1 rounded-full whitespace-nowrap">残り苦手: ${weakInSection.length}問</span>`;
    } else {
      statusHtml = '<span class="bg-gray-100 text-gray-500 font-bold text-xs px-2 py-1 rounded-full whitespace-nowrap">未着手</span>';
    }

    const label = sectionLabels[idx] || '';
    const card = document.createElement('div');
    card.className = 'bg-white rounded-2xl shadow-md p-4';
    card.innerHTML = `
      <div class="flex items-start justify-between mb-1 gap-2">
        <div>
          <h2 class="text-base font-bold text-blue-800">Section ${idx + 1} <span class="text-xs font-normal text-blue-400 ml-1">${label}</span></h2>
          <p class="text-xs text-gray-400">第${idx * SECTION_SIZE + 1}〜${(idx + 1) * SECTION_SIZE}問</p>
        </div>
        ${statusHtml}
      </div>
      <div class="grid grid-cols-3 gap-2 mt-3">
        <button data-section="${idx}" data-mode="all"
          class="quiz-start bg-blue-600 text-white text-sm font-bold py-2 rounded-xl active:bg-blue-800 transition">
          解いてみる
        </button>
        <button data-section="${idx}" data-mode="again"
          class="quiz-start bg-blue-100 text-blue-700 text-sm font-bold py-2 rounded-xl active:bg-blue-200 transition">
          もう一度解く
        </button>
        <button data-section="${idx}" data-mode="weak"
          class="quiz-start text-sm font-bold py-2 rounded-xl transition ${hasWeak
            ? 'bg-orange-100 text-orange-700 active:bg-orange-200'
            : 'bg-gray-100 text-gray-400 cursor-not-allowed opacity-50'}"
          ${hasWeak ? '' : 'disabled'}>
          苦手のみ
        </button>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.quiz-start:not([disabled])').forEach(btn => {
    btn.addEventListener('click', () => {
      startQuiz(parseInt(btn.dataset.section), btn.dataset.mode);
    });
  });
}

// ==================== QUIZ ====================
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz(sectionIdx, mode) {
  const sectionWords = getSections()[sectionIdx];
  const weak = storage.getWeak();

  if (mode === 'weak') {
    currentQueue = sectionWords.filter(w => weak.has(w.id));
    if (currentQueue.length === 0) { renderHome(); return; }
  } else {
    currentQueue = [...sectionWords];
  }

  shuffle(currentQueue);
  currentIndex   = 0;
  sessionCorrect = 0;
  sessionWrong   = 0;

  showScreen('quizScreen');
  loadQuestion();
}

// fillフィールドがあればそれを、なければword を埋め込む
// フレーズ先頭が(____)の場合のみ先頭1文字を大文字にする
function getFilledPhrase(w) {
  const fillStr = (w.fill || w.word).toLowerCase();
  const displayWord = w.phrase.startsWith('(____)')
    ? fillStr.charAt(0).toUpperCase() + fillStr.slice(1)
    : fillStr;
  return w.phrase.replace('(____)', displayWord);
}

function loadQuestion() {
  if (currentIndex >= currentQueue.length) {
    showResult();
    return;
  }
  const w     = currentQueue[currentIndex];
  const total = currentQueue.length;
  const prog  = currentIndex + 1;

  document.getElementById('quizProgress').textContent  = `${prog} / ${total}`;
  document.getElementById('progressBar').style.width   = `${(prog / total) * 100}%`;
  document.getElementById('wordMeaning').textContent   = w.meaning;
  document.getElementById('phraseJa').textContent      = w.phraseJa;
  document.getElementById('phraseDisplay').textContent = w.phrase;

  const input = document.getElementById('spellingInput');
  input.value = '';
  document.getElementById('spellingResult').classList.add('hidden');
  document.getElementById('showAnswerArea').classList.remove('hidden');
  document.getElementById('answerArea').classList.add('hidden');
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function showAnswer() {
  const w = currentQueue[currentIndex];
  const userInput = document.getElementById('spellingInput').value.trim();
  const correct   = w.word.toLowerCase();

  document.getElementById('answerWord').textContent   = correct;
  document.getElementById('answerPhrase').textContent = getFilledPhrase(w);

  const resultEl = document.getElementById('spellingResult');
  if (userInput !== '') {
    const isCorrect = userInput.toLowerCase() === correct;
    if (isCorrect) {
      resultEl.className = 'rounded-xl px-4 py-3 mb-3 text-center bg-green-50 border border-green-300';
      resultEl.innerHTML = '<span class="text-green-700 font-bold text-base">✓ スペル正解！</span>';
    } else {
      resultEl.className = 'rounded-xl px-4 py-3 mb-3 bg-red-50 border border-red-300';
      resultEl.innerHTML = `
        <p class="text-red-600 font-bold text-sm mb-1">✗ スペルミス</p>
        <p class="text-sm text-gray-600">あなたの入力: <span class="font-mono line-through text-gray-400">${escapeHtml(userInput)}</span></p>
        <p class="text-sm text-gray-600">正解: <span class="font-mono font-bold text-red-600">${correct}</span></p>
      `;
    }
    resultEl.classList.remove('hidden');
  } else {
    resultEl.classList.add('hidden');
  }

  document.getElementById('showAnswerArea').classList.add('hidden');
  document.getElementById('answerArea').classList.remove('hidden');
}

function recordAnswer(isCorrect) {
  const w       = currentQueue[currentIndex];
  const weak     = storage.getWeak();
  const answered = storage.getAnswered();

  answered.add(w.id);
  if (isCorrect) {
    weak.delete(w.id);
    sessionCorrect++;
  } else {
    weak.add(w.id);
    sessionWrong++;
  }
  storage.saveWeak(weak);
  storage.saveAnswered(answered);
  currentIndex++;
  loadQuestion();
}

// ==================== SPEECH ====================
function speak(text) {
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 1.0;
  window.speechSynthesis.speak(u);
}

// ==================== RESULT ====================
function showResult() {
  showScreen('resultScreen');
  const total = currentQueue.length;
  const pct   = total > 0 ? Math.round((sessionCorrect / total) * 100) : 0;

  document.getElementById('resultStats').innerHTML = `
    <div class="flex justify-around">
      <div class="text-center">
        <p class="text-3xl font-bold text-green-600">${sessionCorrect}</p>
        <p class="text-xs text-gray-500 mt-1">正解</p>
      </div>
      <div class="text-center">
        <p class="text-3xl font-bold text-red-500">${sessionWrong}</p>
        <p class="text-xs text-gray-500 mt-1">不正解</p>
      </div>
      <div class="text-center">
        <p class="text-3xl font-bold text-blue-600">${pct}%</p>
        <p class="text-xs text-gray-500 mt-1">正解率</p>
      </div>
    </div>
  `;
}

// ==================== EVENT LISTENERS ====================
document.getElementById('showAnswerBtn').addEventListener('click', showAnswer);
document.getElementById('correctBtn').addEventListener('click', () => recordAnswer(true));
document.getElementById('wrongBtn').addEventListener('click',   () => recordAnswer(false));
document.getElementById('backToHomeBtn').addEventListener('click', renderHome);

document.getElementById('spellingInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !document.getElementById('showAnswerArea').classList.contains('hidden')) {
    showAnswer();
  }
});

document.getElementById('speakPhraseBtn').addEventListener('click', () => {
  speak(getFilledPhrase(currentQueue[currentIndex]));
});
document.getElementById('speakWordBtn').addEventListener('click', () => {
  speak(currentQueue[currentIndex].word);
});

document.getElementById('backBtn').addEventListener('click', () => {
  if (confirm('クイズを中断してホームに戻りますか？\n現在のセクションの進捗は破棄されます。')) {
    window.speechSynthesis.cancel();
    renderHome();
  }
});

// ==================== INIT ====================
renderHome();
</script>
